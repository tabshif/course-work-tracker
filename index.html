<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b2d"><title>课业台账</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f4;color:#18251f;font:16px system-ui,"Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}.app{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:235px;background:#123b2d;color:#fff;padding:28px 18px;display:flex;flex-direction:column}.brand{font-size:20px;font-weight:700;padding:8px 12px 28px}.brand small{display:block;color:#b8cec5;font-size:13px;font-weight:400;margin-top:5px}.side nav{display:grid;gap:7px}.side button{border:0;background:transparent;color:#c7dad2;text-align:left;padding:13px 15px;border-radius:12px;cursor:pointer}.side button.active,.side button:hover{background:#285544;color:#fff}.warning{margin-top:auto;border:1px solid #476d5e;border-radius:13px;padding:13px;font-size:13px;color:#c7dad2}.main{margin-left:235px}.top{height:94px;display:flex;align-items:center;padding:0 36px;border-bottom:1px solid #dfe6e1;background:#f9fbf9;position:sticky;top:0;z-index:5}.top h1{font-size:23px;margin:0}.top p{margin:4px 0 0;color:#6a756f;font-size:13px}.top button{margin-left:auto}.content{max-width:1180px;margin:auto;padding:30px 36px 70px}.primary{background:#145c42!important;color:#fff!important;border-color:#145c42!important}button.action{min-height:42px;border:1px solid #d5ded8;background:#fff;border-radius:11px;padding:8px 14px;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.stat,.panel,.card{background:#fff;border:1px solid #dfe6e1;border-radius:17px}.stat{padding:21px}.stat span,.stat small{display:block;color:#657169}.stat b{display:block;font-size:35px;margin:7px 0}.stat.danger{background:#fffafa;border-color:#edc3c3}.stat.danger b{color:#b83b3b}.filters{padding:12px;display:flex;gap:10px;margin:22px 0 28px}.filters select,input,textarea,.modal select{border:1px solid #ccd7d0;border-radius:10px;padding:10px 11px;background:#fff;width:100%}.filters select{max-width:280px}.group h2{font-size:17px}.group h2 span{background:#e4ebe7;color:#68746d;padding:3px 8px;border-radius:20px;font-size:12px;margin-left:8px}.tasks{display:grid;gap:10px}.task{display:flex;gap:13px;align-items:flex-start;background:#fff;border:1px solid #dfe6e1;border-left:4px solid #6d8c7e;border-radius:13px;padding:16px}.task.overdue{border-left-color:#b83b3b}.task.today{border-left-color:#d78326}.done{width:23px;height:23px;border:2px solid #92a39a;border-radius:7px;background:#fff;flex:none;cursor:pointer}.task-main{flex:1;min-width:0}.task-title{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.tag{font-size:12px;color:#145c42;background:#dff1e8;padding:3px 8px;border-radius:20px}.task p{color:#657169;font-size:14px;margin:7px 0}.meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:#657169;font-size:13px;margin-top:9px}.meta button{border:0;background:transparent;color:#145c42;cursor:pointer}.meta select{width:auto;padding:5px}.trash{border:0;background:transparent;color:#a83939;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:17px}.card{padding:21px}.card h2{font-size:19px;margin:15px 0 5px}.card>p{color:#657169;font-size:14px;margin:6px 0}.course-top{display:flex;justify-content:space-between;color:#145c42;font-size:13px}.course-top span{background:#dff1e8;padding:4px 8px;border-radius:20px}.card dl{border-top:1px solid #e6ece8;margin-top:15px}.card dl div{display:flex;justify-content:space-between;border-bottom:1px solid #edf1ee;padding:9px 0;font-size:14px}.card dt{color:#657169}.card dd{margin:0}.card footer,.settings footer{display:flex;justify-content:space-between;margin-top:16px}.assessment{padding:20px;margin-bottom:15px}.assessment header{display:flex;justify-content:space-between}.assessment h2{font-size:18px;margin:0}.assessment header p{font-size:13px;color:#657169}.weight{width:52px;height:52px;border-radius:50%;background:#edf2ef;display:grid;place-items:center;font-weight:700}.ok{color:#145c42;background:#dff1e8}.bad{color:#b83b3b;background:#fde9e7}.item{display:grid;grid-template-columns:70px 1fr auto 30px;gap:12px;align-items:center;border-top:1px solid #e4eae6;padding:14px 0}.item small{color:#145c42}.item p{margin:4px 0;color:#657169;font-size:14px}.settings{max-width:720px;padding:25px;margin-bottom:16px}.settings h2{margin-top:0}.settings label{display:grid;gap:7px;margin:15px 0;font-size:14px;font-weight:600}.switch{grid-template-columns:1fr auto!important;border-top:1px solid #e4eae6;padding-top:15px}.switch input{width:20px}.switch small{display:block;color:#657169;font-weight:400}.status{background:#f0f4f1;border-radius:10px;padding:11px;color:#657169;font-size:14px}.empty{text-align:center;padding:45px;color:#657169}.modal-wrap{position:fixed;inset:0;background:#071c14aa;z-index:20;display:grid;place-items:center;padding:16px}.modal{background:#fff;width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:20px;padding:23px}.modal header{display:flex;justify-content:space-between}.modal header h2{margin:0}.modal label{display:grid;gap:6px;font-weight:600;font-size:14px;margin:14px 0}.modal footer{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.hidden{display:none!important}.notice{padding:12px 15px;background:#fde9e7;color:#8d2929;border-radius:10px;margin-bottom:16px}.menu{display:none}.overlay{display:none}@media(max-width:820px){.side{transform:translateX(-100%);z-index:12;transition:.2s}.side.open{transform:none}.main{margin-left:0}.menu{display:block!important;margin-right:12px!important}.overlay.show{display:block;position:fixed;inset:0;background:#071c1466;z-index:10}.top{padding:0 20px}.content{padding:24px 20px}.cards{grid-template-columns:1fr}}@media(max-width:560px){.stats{grid-template-columns:1fr 1fr}.stat:first-child{grid-column:1/-1}.top p{display:none}.top button.action{padding:8px 10px}.item{grid-template-columns:52px 1fr auto}.cards{gap:12px}}</style></head><body><div class="app"><aside class="side" id="side"><div class="brand">课业台账<small>课程 · 作业 · 考核</small></div><nav><button data-tab="dashboard" class="active">近期作业</button><button data-tab="courses">课程</button><button data-tab="assessments">考核要求</button><button data-tab="settings">设置</button></nav><div class="warning">共享链接模式<br>获得链接的人均可编辑</div></aside><div class="overlay" id="overlay"></div><main class="main"><header class="top"><button class="action menu" id="menu">菜单</button><div><h1 id="title">近期作业</h1><p id="today"></p></div><button class="action primary" id="add">＋ 新增作业</button></header><div class="content" id="content">正在同步课程数据…</div></main></div><div id="modal"></div><script>let D={courses:[],assignments:[],assessments:[],settings:{}},tab='dashboard';const $=s=>document.querySelector(s),E=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('#today').textContent=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date());
async function api(action,payload){let r=await fetch('https://course-work-tracker-2026.myworkspace-8268.chatgpt.site/api/data',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,payload})}),j=await r.json();if(!r.ok)throw Error(j.error);await load()}
async function load(){try{let r=await fetch('https://course-work-tracker-2026.myworkspace-8268.chatgpt.site/api/data'),j=await r.json();if(!r.ok)throw Error(j.error);D=j;render()}catch(e){$('#content').innerHTML='<div class="notice">'+E(e.message)+'</div>'}}
function b(v){let n=new Date(),d=new Date(v),a=new Date(n.getFullYear(),n.getMonth(),n.getDate()),x=new Date(d.getFullYear(),d.getMonth(),d.getDate()),z=Math.round((x-a)/864e5);return z<0?'overdue':z===0?'today':z<=3?'three':z<=7?'week':'later'}function f(v){return new Intl.DateTimeFormat('zh-CN',{month:'numeric',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Shanghai'}).format(new Date(v))}
document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{tab=x.dataset.tab;document.querySelectorAll('[data-tab]').forEach(y=>y.classList.toggle('active',y===x));$('#side').classList.remove('open');$('#overlay').classList.remove('show');render()});$('#menu').onclick=()=>{$('#side').classList.add('open');$('#overlay').classList.add('show')};$('#overlay').onclick=()=>{$('#side').classList.remove('open');$('#overlay').classList.remove('show')};$('#add').onclick=()=>showModal(tab==='assessments'?'assessment':tab==='courses'?'course':'assignment');
function render(){let titles={dashboard:'近期作业',courses:'课程',assessments:'考核要求',settings:'设置'};$('#title').textContent=titles[tab];$('#add').classList.toggle('hidden',tab==='settings');$('#add').textContent='＋ 新增'+(tab==='assessments'?'考核项':tab==='courses'?'课程':'作业');tab==='dashboard'?dash():tab==='courses'?courses():tab==='assessments'?assess():settings()}
function dash(){let open=D.assignments.filter(a=>a.status!=='completed'),over=open.filter(a=>b(a.due_at)==='overdue').length,cm=Object.fromEntries(D.courses.map(c=>[c.id,c]));let h='<section class="stats"><div class="stat"><span>课程</span><b>'+D.courses.length+'</b><small>'+D.courses.reduce((s,c)=>s+c.credits,0)+' 学分</small></div><div class="stat"><span>待完成</span><b>'+open.length+'</b><small>按截止时间排序</small></div><div class="stat '+(over?'danger':'')+'"><span>已逾期</span><b>'+over+'</b><small>'+(over?'需要尽快处理':'目前没有逾期')+'</small></div></section><section class="panel filters"><select id="cf"><option value="all">全部课程</option>'+D.courses.map(c=>'<option value="'+c.id+'">'+E(c.name)+'</option>').join('')+'</select><select id="sf"><option value="open">待完成</option><option value="all">全部状态</option><option value="not_started">未开始</option><option value="in_progress">进行中</option><option value="completed">已完成</option></select></section><div id="groups"></div>';$('#content').innerHTML=h;let draw=()=>{let c=$('#cf').value,s=$('#sf').value,list=D.assignments.filter(a=>(c==='all'||a.course_id==c)&&(s==='all'||(s==='open'?a.status!=='completed':a.status===s))).sort((a,z)=>a.due_at.localeCompare(z.due_at)),gs=[['overdue','已逾期'],['today','今天截止'],['three','3天内'],['week','本周'],['later','以后']];$('#groups').innerHTML=gs.map(([k,l])=>{let x=list.filter(a=>b(a.due_at)===k);return x.length?'<section class="group"><h2>'+l+'<span>'+x.length+'</span></h2><div class="tasks">'+x.map(a=>'<article class="task '+k+'"><button class="done" onclick="complete('+a.id+',\''+a.status+'\')">'+(a.status==='completed'?'✓':'')+'</button><div class="task-main"><div class="task-title"><b>'+E(a.title)+'</b><span class="tag">'+E(cm[a.course_id]?.name||'')+'</span></div>'+(a.description?'<p>'+E(a.description)+'</p>':'')+'<div class="meta"><span>'+f(a.due_at)+'</span>'+(a.folder_path?'<button onclick="copyPath(\''+encodeURIComponent(a.folder_path)+'\')">复制路径</button>':'')+'<select onchange="statusChange('+a.id+',this.value)"><option value="not_started" '+(a.status==='not_started'?'selected':'')+'>未开始</option><option value="in_progress" '+(a.status==='in_progress'?'selected':'')+'>进行中</option><option value="completed" '+(a.status==='completed'?'selected':'')+'>已完成</option></select></div></div><button class="trash" onclick="delAssignment('+a.id+')">删除</button></article>').join('')+'</div></section>':''}).join('')||'<div class="panel empty">还没有符合条件的作业</div>'};$('#cf').onchange=draw;$('#sf').onchange=draw;draw()}
window.complete=(id,s)=>api('update_assignment',{id,status:s==='completed'?'not_started':'completed'});window.statusChange=(id,status)=>api('update_assignment',{id,status});window.copyPath=p=>navigator.clipboard.writeText(decodeURIComponent(p));window.delAssignment=id=>confirm('删除这项作业？')&&api('delete_assignment',{id});
function courses(){$('#content').innerHTML='<div class="cards">'+D.courses.map(c=>{let ts=D.assignments.filter(a=>a.course_id===c.id),as=D.assessments.filter(a=>a.course_id===c.id),t=as.reduce((s,a)=>s+(a.weight||0),0);return '<article class="card"><div class="course-top"><span>'+E(c.property)+'</span><b>'+c.credits+' 学分</b></div><h2>'+E(c.name)+'</h2><p>'+E(c.teacher)+' · '+E(c.classroom)+'</p><p>'+E(c.schedule)+'</p><dl><div><dt>考核方式</dt><dd>'+E(c.exam_method)+'</dd></div><div><dt>待完成作业</dt><dd>'+ts.filter(a=>a.status!=='completed').length+' 项</dd></div><div><dt>已录入占比</dt><dd>'+t+'%</dd></div></dl><footer><button class="action" onclick="showModal(\'assignment\','+c.id+')">＋ 添加作业</button><button class="action" onclick="delCourse('+c.id+',\''+encodeURIComponent(c.name)+'\','+ts.length+','+as.length+')">删除</button></footer></article>'}).join('')+'</div>'}window.delCourse=(id,n,t,a)=>confirm('删除“'+decodeURIComponent(n)+'”？其 '+t+' 项作业和 '+a+' 项考核要求也会删除。')&&api('delete_course',{id});
function assess(){ $('#content').innerHTML=D.courses.map(c=>{let x=D.assessments.filter(a=>a.course_id===c.id),t=x.reduce((s,a)=>s+(a.weight||0),0);return '<section class="panel assessment"><header><div><h2>'+E(c.name)+'</h2><p>'+E(c.exam_method)+'</p></div><span class="weight '+(t===100?'ok':t>100?'bad':'')+'">'+t+'%</span></header>'+(x.length?x.map(a=>'<article class="item"><small>'+E(a.type)+'</small><div><b>'+E(a.name)+'</b>'+(a.requirements?'<p>'+E(a.requirements)+'</p>':'')+'</div><strong>'+(a.weight==null?'待定':a.weight+'%')+'</strong><button class="trash" onclick="api(\'delete_assessment\',{id:'+a.id+'})">删除</button></article>').join(''):'<p class="empty">尚未补录详细考核要求</p>')+'</section>'}).join('')}
function settings(){let s=D.settings;$('#content').innerHTML='<section class="panel settings"><h2>邮件提醒</h2><p>提前 3 天和截止当天各提醒一次。</p><label>收件邮箱<input id="email" type="email" value="'+E(s.recipient_email||'')+'" placeholder="name@example.com"></label><label>时区<select><option>Asia/Shanghai</option></select></label><label class="switch"><span>提前 3 天提醒<small>未完成作业才会发送</small></span><input id="r3" type="checkbox" '+(s.remind_three_days?'checked':'')+'></label><label class="switch"><span>截止当天提醒<small>当天上午汇总发送</small></span><input id="r0" type="checkbox" '+(s.remind_due_day?'checked':'')+'></label><p class="status">最近状态：'+E(s.last_email_status||'尚未发送')+'</p><footer><button class="action" onclick="testMail()">发送测试邮件</button><button class="action primary" onclick="saveSettings()">保存设置</button></footer></section><section class="panel settings"><h2>共享链接说明</h2><p>获得链接的人可以查看和修改全部课程数据，请谨慎转发。</p><p>文件夹字段仅保存路径文字，不会读取或上传电脑中的文件。</p></section>'}window.saveSettings=()=>api('update_settings',{recipientEmail:$('#email').value,remindThreeDays:$('#r3').checked,remindDueDay:$('#r0').checked});window.testMail=async()=>{let r=await fetch('https://course-work-tracker-2026.myworkspace-8268.chatgpt.site/api/reminders',{method:'POST',headers:{'content-type':'application/json'},body:'{"test":true}'}),j=await r.json();alert(j.message||j.error);load()};
window.showModal=function(kind,cid){let opts=D.courses.map(c=>'<option value="'+c.id+'" '+(c.id===cid?'selected':'')+'>'+E(c.name)+'</option>').join(''),body=kind==='assignment'?'<label>课程<select name="courseId">'+opts+'</select></label><label>作业名称<input name="title" required></label><label>内容说明<textarea name="description"></textarea></label><label>截止时间<input name="dueAt" type="datetime-local" required></label><label>状态<select name="status"><option value="not_started">未开始</option><option value="in_progress">进行中</option><option value="completed">已完成</option></select></label><label>电脑文件夹路径<input name="folderPath" placeholder="例如 D:\\课程\\算法设计"></label>':kind==='assessment'?'<label>课程<select name="courseId">'+opts+'</select></label><label>项目名称<input name="name" required></label><label>类型<select name="type"><option>考试</option><option>作业</option><option>报告</option><option>出勤</option><option>展示</option><option>其他</option></select></label><label>占比（%）<input name="weight" type="number" step="0.5" placeholder="未知可留空"></label><label>要求说明<textarea name="requirements"></textarea></label>':'<label>课程名称<input name="name" required></label><label>课程编码<input name="code" required></label><label>学分<input name="credits" type="number" step="0.5" required></label><label>主讲教师<input name="teacher"></label><label>教室<input name="classroom"></label><label>上课时间<input name="schedule"></label><label>考试方式<input name="examMethod"></label>';$('#modal').innerHTML='<div class="modal-wrap"><form class="modal" id="form"><header><h2>新增'+(kind==='assignment'?'作业':kind==='assessment'?'考核项目':'课程')+'</h2><button type="button" class="trash" onclick="closeModal()">关闭</button></header>'+body+'<footer><button type="button" class="action" onclick="closeModal()">取消</button><button class="action primary">保存</button></footer></form></div>';$('#form').onsubmit=async e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));if(v.courseId)v.courseId=Number(v.courseId);if(kind==='assessment')v.weight=v.weight===''?null:Number(v.weight);if(kind==='course')Object.assign(v,{credits:Number(v.credits),department:'手动添加',property:'其他课程',level:'硕士课程'});await api('create_'+kind,v);closeModal()}};window.closeModal=()=>$('#modal').innerHTML='';load();</script></body></html>
